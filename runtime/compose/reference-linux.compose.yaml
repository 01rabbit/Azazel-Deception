services:
  intranet-web:
    image: ghcr.io/01rabbit/azazel-deception-reference-web@sha256:c187c4ce32a244a45848bceee7ce9aa5c0146bd42e5dc0e03844e56083e2a043
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - decoy_internal

networks:
  decoy_internal:
    internal: true

# Phase-1 reference only.
# The image is pinned to an immutable multi-architecture OCI index that carries
# platform-specific SPDX SBOM attestations and GitHub/Sigstore build provenance.
# No host ports are published and no external network is attached. The image
# runs non-root on TCP/8080 with all Linux capabilities dropped.
# Edge-approved routing/exposure remains outside this Compose asset.
