services:
  intranet-web:
    image: nginx:1.27-alpine
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - decoy_internal

networks:
  decoy_internal:
    internal: true

# Phase-1 reference only.
# No host ports are published and no external network is attached.
# Nginx runs as non-root on TCP/8080 with all Linux capabilities dropped.
# Edge-approved routing/exposure remains outside this Compose asset.
