schema_version: deception-package/bootstrap-v0.1
package_id: municipal-linux-v1
version: 0.1.0
narrative:
  purpose: "reference static municipal-office Linux decoy"
  organization_type: municipal-office
  department: public-health
  host_role: intranet-web
  locale: ja-JP
  timezone: Asia/Tokyo
  synthetic_only: true
runtime_requirements:
  architectures: [arm64, amd64]
  runtime_adapter: docker_compose
  kvm_required: false
  gpu_required: false
safety:
  outbound_allowed: false
  production_access: false
  max_duration_seconds: 300
  cpu_limit: 1.0
  memory_mb: 512
  storage_mb: 1024
  max_connections: 100
components:
  - id: intranet-web
    required: true
    image: nginx:1.27-alpine
    image_provenance: bootstrap-unpinned-reference
    privileged: false
    host_network: false
    exposed_service: http
    container_port: 8080
  - id: evidence-sidecar-placeholder
    required: false
    image: alpine:3.20
    image_provenance: bootstrap-unpinned-reference
    privileged: false
    host_network: false
deployment_tiers:
  lite:
    minimum:
      cpu_cores: 2
      memory_mb: 1024
      storage_mb: 2048
    include: [intranet-web]
  standard:
    minimum:
      cpu_cores: 4
      memory_mb: 4096
      storage_mb: 8192
    include: [intranet-web, evidence-sidecar-placeholder]
narrative_consistency:
  fatal_contradictions: []
  warnings:
    - "bootstrap package: OCI digests/signatures become mandatory when Fabric#9 contract is released"
activation:
  requires_edge_decision: true
  bootstrap_live_execution: false
