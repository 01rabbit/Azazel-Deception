[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azazel-deception"
version = "0.2.0.dev0"
description = "AZ-06 container-first engagement environment runtime for the Azazel series"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "01rabbit"}]
dependencies = [
    "PyYAML>=6.0",
    "azazel-fabric @ git+https://github.com/01rabbit/Azazel-Fabric.git@86ff0896f881e37bcb96c405fe64552eff7fdf19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
azazel-deception = "azazel_deception.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
