name: Reference Image SBOM RC

on:
  push:
    branches: [main]
    paths:
      - images/reference-web/**
      - runtime/compose/nginx.conf
      - runtime/compose/html/**
      - .github/workflows/reference-image-sbom.yml
  workflow_dispatch:
    inputs:
      attest_digest:
        description: >-
          Existing immutable multi-arch manifest digest (sha256:...) whose
          attached SPDX SBOMs should be re-published as GitHub SPDX
          attestations, without rebuilding the image. Leave empty to run the
          normal build-sbom-rc job.
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE: ghcr.io/01rabbit/azazel-deception-reference-web

jobs:
  build-sbom-rc:
    if: github.event_name == 'push' || inputs.attest_digest == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-platform SBOM release candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/reference-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/01rabbit/azazel-deception-reference-web:sbom-sha-${{ github.sha }}
            ghcr.io/01rabbit/azazel-deception-reference-web:phase1-sbom
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/01rabbit/Azazel-Deception
      - name: Inspect immutable manifest and attached SBOMs
        id: inspect
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          mkdir -p artifacts/sbom
          docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' > artifacts/manifest.json
          docker buildx imagetools inspect "$ref" --format '{{json (index .SBOM "linux/amd64").SPDX}}' > artifacts/sbom/linux-amd64.spdx.json
          docker buildx imagetools inspect "$ref" --format '{{json (index .SBOM "linux/arm64").SPDX}}' > artifacts/sbom/linux-arm64.spdx.json
          jq -e '.SPDXID == "SPDXRef-DOCUMENT"' artifacts/sbom/linux-amd64.spdx.json >/dev/null
          jq -e '.SPDXID == "SPDXRef-DOCUMENT"' artifacts/sbom/linux-arm64.spdx.json >/dev/null
          amd64_digest="$(jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest' artifacts/manifest.json | head -n1)"
          arm64_digest="$(jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="arm64") | .digest' artifacts/manifest.json | head -n1)"
          test -n "$amd64_digest"
          test -n "$arm64_digest"
          jq -n \
            --arg image "$IMAGE" \
            --arg source_sha "$GITHUB_SHA" \
            --arg manifest_digest "$DIGEST" \
            --arg amd64_digest "$amd64_digest" \
            --arg arm64_digest "$arm64_digest" \
            '{schema_version:"az06-reference-image-sbom/v0.1", image:$image, source_sha:$source_sha, manifest_digest:$manifest_digest, platforms:{amd64:$amd64_digest, arm64:$arm64_digest}, sbom:{amd64:"attached:spdx",arm64:"attached:spdx"}}' \
            | tee artifacts/reference-image-sbom.json
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub provenance attestation for SBOM RC index
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/01rabbit/azazel-deception-reference-web
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: reference-image-sbom-rc
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  # Publish the already-attached SPDX SBOMs of an existing immutable digest as
  # GitHub SPDX attestations, so `GitHubSbomVerifier` (`gh attestation verify
  # --predicate-type https://spdx.dev/Document`) passes against the pinned
  # reference image without a rebuild (digest, and therefore the sealed
  # package_digest, stay unchanged).
  attest-existing-sbom:
    if: github.event_name == 'workflow_dispatch' && inputs.attest_digest != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Extract attached SPDX SBOMs from the pinned digest
        env:
          DIGEST: ${{ inputs.attest_digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::attest_digest must be an immutable sha256: digest"; exit 1 ;;
          esac
          ref="$IMAGE@$DIGEST"
          mkdir -p artifacts/sbom
          docker buildx imagetools inspect "$ref" --format '{{json (index .SBOM "linux/amd64").SPDX}}' > artifacts/sbom/linux-amd64.spdx.json
          docker buildx imagetools inspect "$ref" --format '{{json (index .SBOM "linux/arm64").SPDX}}' > artifacts/sbom/linux-arm64.spdx.json
          jq -e '.SPDXID == "SPDXRef-DOCUMENT"' artifacts/sbom/linux-amd64.spdx.json >/dev/null
          jq -e '.SPDXID == "SPDXRef-DOCUMENT"' artifacts/sbom/linux-arm64.spdx.json >/dev/null
      - name: Attest SPDX SBOM (linux/amd64) for the manifest digest
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/01rabbit/azazel-deception-reference-web
          subject-digest: ${{ inputs.attest_digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: artifacts/sbom/linux-amd64.spdx.json
          push-to-registry: true
      - name: Attest SPDX SBOM (linux/arm64) for the manifest digest
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/01rabbit/azazel-deception-reference-web
          subject-digest: ${{ inputs.attest_digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: artifacts/sbom/linux-arm64.spdx.json
          push-to-registry: true
      - name: Verify GH-store SPDX attestation exactly as GitHubSbomVerifier does
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ inputs.attest_digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document \
            --deny-self-hosted-runners
      - uses: actions/upload-artifact@v4
        with:
          name: reference-image-sbom-attestation
          path: artifacts/sbom/
          if-no-files-found: error
          retention-days: 90
