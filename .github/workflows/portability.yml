name: Portability

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-contract:
    name: native-contract (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-24.04
            expected_arch: amd64
            local_plan: true
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            expected_arch: arm64
            local_plan: true
          - label: macos-arm64
            runner: macos-15
            expected_arch: arm64
            local_plan: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: Assert native AZ-06 architecture and capability discovery
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          from azazel_deception.capabilities import detect_host_capabilities

          payload = detect_host_capabilities()
          print(json.dumps({"machine": platform.machine(), "capabilities": payload}, indent=2, sort_keys=True))
          assert payload["architecture"] == os.environ["EXPECTED_ARCH"], payload
          assert payload["memory_mb"] > 1024, payload
          assert payload["authority"] == "descriptive_only", payload
          PY
      - run: python -m azazel_deception validate examples/packages/municipal-linux-v1/package.yaml
      - name: Plan against native Docker-capable host
        if: ${{ matrix.local_plan }}
        run: python -m azazel_deception plan examples/packages/municipal-linux-v1/package.yaml --tier lite
      - name: Confirm macOS host remains descriptive without Linux runtime
        if: ${{ !matrix.local_plan }}
        run: |
          python - <<'PY'
          from azazel_deception.capabilities import detect_host_capabilities
          payload = detect_host_capabilities()
          assert payload["architecture"] == "arm64"
          assert payload["kvm_available"] is False
          assert payload["network_features"]["network_namespace"] is False
          assert payload["network_features"]["nftables"] is False
          PY

  native-compose-smoke:
    name: native-compose-smoke (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-24.04
          - label: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Docker runtime information
        run: |
          uname -a
          docker --version
          docker compose version
      - name: Start, inspect, and record isolated reference runtime
        env:
          AZ06_EVIDENCE_OUT: artifacts/portability/${{ matrix.label }}.json
        run: bash scripts/dev/reference-compose-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: az06-portability-${{ matrix.label }}
          path: artifacts/portability/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 30
